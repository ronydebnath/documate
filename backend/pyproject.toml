[project]
name = "documate-backend"
version = "0.1.0"
description = "DocuMate backend: ingestion, retrieval, generation, and evals."
readme = "../README.md"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # LLM + embeddings
    "anthropic>=0.40",
    "openai>=1.54",

    # Vector store
    "chromadb>=0.5",

    # Ingestion
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "httpx>=0.28",
    "tiktoken>=0.8",

    # Evals
    "pyyaml>=6.0",

    # Misc
    "tenacity>=9.0",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
